# =============================================================================
# LiveMetric — Stack de Docker Swarm (entorno de produccion simulado)
#
# Corresponde a la Fase 5 del ciclo DevSecOps: despliegue orquestado.
#
# Diferencia clave frente a docker-compose.yml: este stack NO construye
# imagenes. Consume las que el workflow "release.yml" ya publico en Docker Hub
# despues de superar el escaneo de Trivy. Es lo que hace que el despliegue sea
# reproducible: se despliega un artefacto versionado y verificado, no el
# resultado de compilar el codigo que haya en la maquina en ese momento.
#
# Despliegue:
#   cd orquestacion && ./deploy.sh v1.3.2
#
# Ver orquestacion/README.md para el detalle.
# =============================================================================

version: "3.8"

x-deploy-defaults: &deploy-defaults
  replicas: 2
  update_config:
    # Despliegue sin interrupcion: actualiza una replica a la vez y espera a
    # que quede sana antes de tocar la siguiente.
    parallelism: 1
    delay: 10s
    order: start-first
    failure_action: rollback
  rollback_config:
    parallelism: 1
    order: stop-first
  restart_policy:
    condition: on-failure
    delay: 5s
    max_attempts: 3
    window: 60s
  resources:
    limits:
      cpus: "0.50"
      memory: 256M
    reservations:
      cpus: "0.10"
      memory: 64M

x-service-common: &service-common
  networks:
    - app-net
  read_only: true
  # En Swarm la clave "tmpfs" del compose se ignora: los tmpfs van con la
  # sintaxis larga de volumes. Un servicio que declare sus propios volumes
  # tiene que repetir este. Sin opciones: "docker stack deploy" descarta el
  # modo de un tmpfs y lo dejaria inaccesible; sin ellas queda en 1777.
  # Los frontends (nginx) escriben todo en /tmp, asi que les alcanza.
  volumes:
    - type: tmpfs
      target: /tmp
  # Swarm no soporta "security_opt" (no-new-privileges): en su lugar, sin
  # ninguna capability de Linux. Ningun servicio las necesita: todos corren
  # sin root, y nginx escucha en el 8080.
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-db-env: &db-env
  DB_HOST: postgres
  DB_PORT: 5432
  DB_NAME: ${POSTGRES_DB:-livemetric}
  DB_USER: ${POSTGRES_USER:-livemetric}
  DB_PASSWORD: ${POSTGRES_PASSWORD}

# Los 5 servicios de backend estan en app-net (entre ellos y el frontend) y
# en db-net (la base). El frontend solo en app-net: nunca habla con la base.
x-backend-networks: &backend-networks
  - app-net
  - db-net

networks:
  app-net:
    driver: overlay
    # Red cifrada entre nodos: en Swarm el trafico entre servicios puede
    # cruzar la red fisica entre maquinas, asi que se cifra en transito.
    driver_opts:
      encrypted: "true"
    attachable: false
  # Solo la base y los backends; "internal": sin salida a Internet y sin
  # acceso desde fuera del stack.
  db-net:
    driver: overlay
    internal: true
    driver_opts:
      encrypted: "true"
    attachable: false

volumes:
  db-data:

# El esquema inicial, como config de Swarm. Las configs no se pueden
# modificar una vez creadas: el nombre lleva la version para que cada
# release traiga la suya en vez de chocar con la anterior.
configs:
  init_sql:
    name: livemetric_init_sql_${LIVEMETRIC_VERSION}
    file: ../db/init.sql

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL 16. Replica unica y fijada al nodo manager: el volumen de
  # datos es local a un nodo, y una segunda replica no compartiria los datos.
  # Carga db/init.sql (config "init_sql") solo con el volumen vacio.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-livemetric}
      POSTGRES_USER: ${POSTGRES_USER:-livemetric}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    configs:
      - source: init_sql
        target: /docker-entrypoint-initdb.d/init.sql
    networks:
      - db-net
    healthcheck:
      # Por TCP a proposito: mientras corre init.sql, Postgres atiende solo
      # por socket local, asi que no figura "sano" hasta terminar.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  # ---------------------------------------------------------------------------
  # Auth — identidad y emision de JWT
  # ---------------------------------------------------------------------------
  auth-service:
    <<: *service-common
    networks: *backend-networks
    image: ${DOCKERHUB_NAMESPACE}/livemetric-auth:${LIVEMETRIC_VERSION}
    environment:
      <<: *db-env
      NODE_ENV: production
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      VOTER_JWT_EXPIRES_IN: ${VOTER_JWT_EXPIRES_IN:-10m}
      PIN_VIGENCIA_HORAS: ${PIN_VIGENCIA_HORAS:-24}
      VOTER_ID_SALT: ${VOTER_ID_SALT}
      VOTERS_ENCRYPTION_KEY: ${VOTERS_ENCRYPTION_KEY}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
    deploy: *deploy-defaults

  # ---------------------------------------------------------------------------
  # Voting — emision de votos
  # ---------------------------------------------------------------------------
  voting-service:
    <<: *service-common
    networks: *backend-networks
    image: ${DOCKERHUB_NAMESPACE}/livemetric-voting:${LIVEMETRIC_VERSION}
    environment:
      <<: *db-env
      NODE_ENV: production
      PORT: 3002
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
    deploy: *deploy-defaults

  # ---------------------------------------------------------------------------
  # Analytics — resultados y tableros
  # ---------------------------------------------------------------------------
  analytics-service:
    <<: *service-common
    networks: *backend-networks
    image: ${DOCKERHUB_NAMESPACE}/livemetric-analytics:${LIVEMETRIC_VERSION}
    environment:
      <<: *db-env
      NODE_ENV: production
      PORT: 3003
      JWT_SECRET: ${JWT_SECRET}
      # Lee el padron cifrado (participacion): sin esta clave no arranca.
      VOTERS_ENCRYPTION_KEY: ${VOTERS_ENCRYPTION_KEY}
      # Solo la publica: verifica la firma de las actas, no puede firmar.
      ACTA_PUBLIC_KEY: ${ACTA_PUBLIC_KEY}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
    deploy: *deploy-defaults

  # ---------------------------------------------------------------------------
  # Scrutiny — certificacion y cadena de actas
  #
  # REPLICA UNICA A PROPOSITO: la certificacion encadena hashes, y dos replicas
  # certificando la misma eleccion en paralelo podrian producir dos eslabones
  # compitiendo por la misma posicion de la cadena. La correccion del escrutinio
  # vale mas que su disponibilidad.
  # ---------------------------------------------------------------------------
  scrutiny-service:
    <<: *service-common
    networks: *backend-networks
    image: ${DOCKERHUB_NAMESPACE}/livemetric-scrutiny:${LIVEMETRIC_VERSION}
    environment:
      <<: *db-env
      NODE_ENV: production
      PORT: 3004
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      # La privada firma cada acta al certificarla; es el unico servicio que
      # la tiene.
      ACTA_SIGNING_KEY: ${ACTA_SIGNING_KEY}
      ACTA_PUBLIC_KEY: ${ACTA_PUBLIC_KEY}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
    deploy:
      <<: *deploy-defaults
      replicas: 1
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback

  # ---------------------------------------------------------------------------
  # Scheduler — worker de apertura, cierre y certificacion automatica
  #
  # REPLICA UNICA OBLIGATORIA: dos workers con el mismo cron dispararian dos
  # veces el cierre y la certificacion de la misma eleccion.
  # ---------------------------------------------------------------------------
  scheduler-worker:
    <<: *service-common
    networks: *backend-networks
    image: ${DOCKERHUB_NAMESPACE}/livemetric-scheduler:${LIVEMETRIC_VERSION}
    environment:
      <<: *db-env
      NODE_ENV: production
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      SCRUTINY_INTERNAL_URL: http://scrutiny-service:3004
    deploy:
      <<: *deploy-defaults
      replicas: 1
      update_config:
        parallelism: 1
        order: stop-first

  # ---------------------------------------------------------------------------
  # Frontend — SPA servida por nginx
  # ---------------------------------------------------------------------------
  frontend:
    <<: *service-common
    image: ${DOCKERHUB_NAMESPACE}/livemetric-frontend:${LIVEMETRIC_VERSION}
    # Es el UNICO puerto publicado del stack: los cuatro servicios del API no
    # publican los suyos (en Swarm quedarian abiertos en todas las
    # interfaces); se llega a ellos a traves de nginx, por la red interna.
    # Rutas relativas: el navegador solo habla con el frontend, y nginx
    # reenvia a cada servicio por app-net (igual que en docker-compose.yml).
    # Asi la Content-Security-Policy puede limitar las conexiones a este origen.
    environment:
      AUTH_URL: /auth
      VOTING_URL: /voting
      ANALYTICS_URL: /analytics
      SCRUTINY_URL: /scrutiny
    ports:
      - target: 8080
        published: 3000
        protocol: tcp
        mode: ingress
    deploy: *deploy-defaults
