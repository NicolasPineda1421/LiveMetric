name: LiveMetric Release — Publicacion en Docker Hub

# =============================================================================
# Publica las 8 imagenes del proyecto en Docker Hub, versionadas con semver:
# los 6 componentes, la base con su esquema (livemetric-db) y la de instalacion
# (livemetric), la puerta de entrada: deja en la carpeta del usuario el compose
# de docker-hub/ y el .env, y su README es la pagina del repo en Docker Hub.
#
# Se separa de "devsecops.yml" a proposito: ese pipeline corre en CADA push y
# PR y su trabajo es BLOQUEAR codigo inseguro; este corre solo cuando el
# equipo decide liberar una version, y su trabajo es PUBLICAR. Mezclarlos
# significaria publicar una imagen en cada commit, lo que hace que el tag
# "latest" deje de significar nada.
#
# Disparadores:
#   - push de un tag semver (v1.0.0, v1.2.3): el caso normal de release.
#   - workflow_dispatch: ejecucion manual indicando la version, util para la
#     sustentacion o para republicar sin crear un tag nuevo.
#
# Puerta de seguridad: las 8 imagenes se construyen y se escanean con Trivy, y
# SOLO se publican si pasan las 8 y si el compose de Docker Hub arranca con
# ellas. Una imagen con CVEs CRITICAL/HIGH nunca llega a Docker Hub, y
# tampoco las demas de esa version.
#
# "latest": lo recibe la version solo si es la mas nueva de los tags de git
# (republicar una version vieja no lo mueve hacia atras), y al final se
# comprueba en Docker Hub que latest y la version son la misma imagen en las 8.
#
# Requisitos de configuracion (una sola vez, en el repositorio de GitHub):
#   Settings > Secrets and variables > Actions
#     - Secret   DOCKERHUB_TOKEN      -> Access Token generado en Docker Hub
#                                        (Account Settings > Personal access
#                                        tokens > New, permiso Read & Write).
#                                        NO usar la contraseña de la cuenta.
#     - Variable DOCKERHUB_NAMESPACE  -> usuario u organizacion de Docker Hub
#                                        bajo la que se publican las imagenes
#                                        (ej. "livemetric").
#     - Secret   DOCKERHUB_USERNAME   -> usuario con el que se hace login
#                                        (normalmente igual al namespace).
#     - Secret   DOCKERHUB_DESCRIPCION_TOKEN (opcional) -> Access Token con
#                                        permiso Read, Write, Delete, solo
#                                        para publicar docker-hub/README.md
#                                        como la pagina del repo livemetric
#                                        (Docker Hub no deja cambiarla con
#                                        uno Read & Write). Sin el, se intenta
#                                        con DOCKERHUB_TOKEN y, si no alcanza,
#                                        el resumen lo avisa.
# =============================================================================

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version a publicar (formato vX.Y.Z, ej. v1.0.0)'
        required: true
        type: string

# Minimo privilegio: este workflow solo necesita leer el codigo. No escribe
# nada en el repositorio.
permissions:
  contents: read

# Una publicacion a la vez, de cualquier version: dos corridas al mismo tiempo
# podrian dejar "latest" en la que termine ultima y no en la mas nueva. La que
# llega mientras otra corre espera su turno (no la cancela).
concurrency:
  group: release
  cancel-in-progress: false

jobs:

  # ---------------------------------------------------------------------------
  # 1) Resuelve la version una sola vez y la comparte con el resto de jobs,
  #    para que las 8 imagenes lleven exactamente el mismo numero.
  # ---------------------------------------------------------------------------
  version:
    name: Resolver version
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.resolve.outputs.semver }}
      latest: ${{ steps.resolve.outputs.latest }}
    steps:
      # Todos los tags de git, para saber si esta es la version mas nueva.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Determinar y validar la version
        id: resolve
        # La version escrita a mano en workflow_dispatch entra por variable de
        # entorno y no con ${{ }} dentro del script: interpolada ahi, un valor
        # como 'v1.0.0"; <comando>; "' se ejecutaria en el runner ANTES de
        # llegar a la validacion de abajo (inyeccion de comandos).
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi

          # Falla temprano si el formato no es semver: mejor detenerse aqui
          # que publicar una imagen con un tag invalido en Docker Hub.
          if ! echo "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "❌ Version invalida: '$VERSION'. Se espera el formato vX.Y.Z (ej. v1.0.0)."
            exit 1
          fi

          # "latest" es siempre la version mas nueva: solo la lleva si esta lo
          # es (republicar una version vieja no la mueve hacia atras).
          MAS_NUEVA="$({ echo "$VERSION"; git tag --list 'v*.*.*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$'; } | sort -V | tail -n 1)"
          if [ "$MAS_NUEVA" = "$VERSION" ]; then LATEST=true; else LATEST=false; fi

          {
            echo "semver=${VERSION}"
            echo "latest=${LATEST}"
          } >> "$GITHUB_OUTPUT"
          if [ "$LATEST" = true ]; then
            echo "✅ Publicando la version ${VERSION}, que pasa a ser latest"
          else
            echo "✅ Publicando la version ${VERSION}; latest sigue en ${MAS_NUEVA}, que es mas nueva"
          fi

  # ---------------------------------------------------------------------------
  # 2) Construye y escanea cada microservicio, sin publicar nada todavia.
  #    Se publica solo si pasan TODAS (job "publish", mas abajo): asi
  #    "latest" se mueve en todas las imagenes juntas o en ninguna, y nunca
  #    quedan unas en una version y otras en otra.
  # ---------------------------------------------------------------------------
  scan:
    name: Escanear ${{ matrix.service }}
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # Sin fail-fast: si una imagen falla el escaneo, queremos ver el estado
      # de las demas en la misma corrida, no un reporte a medias.
      fail-fast: false
      matrix:
        # "db": la base con su esquema (db/Dockerfile).
        include:
          - { service: auth, image: livemetric-auth, context: ./services/auth, dockerfile: ./services/auth/Dockerfile, descripcion: "Microservicio auth de LiveMetric" }
          - { service: voting, image: livemetric-voting, context: ./services/voting, dockerfile: ./services/voting/Dockerfile, descripcion: "Microservicio voting de LiveMetric" }
          - { service: analytics, image: livemetric-analytics, context: ./services/analytics, dockerfile: ./services/analytics/Dockerfile, descripcion: "Microservicio analytics de LiveMetric" }
          - { service: scrutiny, image: livemetric-scrutiny, context: ./services/scrutiny, dockerfile: ./services/scrutiny/Dockerfile, descripcion: "Microservicio scrutiny de LiveMetric" }
          - { service: scheduler, image: livemetric-scheduler, context: ./services/scheduler, dockerfile: ./services/scheduler/Dockerfile, descripcion: "Microservicio scheduler de LiveMetric" }
          - { service: frontend, image: livemetric-frontend, context: ./services/frontend, dockerfile: ./services/frontend/Dockerfile, descripcion: "Frontend de LiveMetric (React + nginx)" }
          - { service: db, image: livemetric-db, context: ./db, dockerfile: ./db/Dockerfile, descripcion: "Base de datos de LiveMetric: PostgreSQL 16 con el esquema y las migraciones" }
          # La puerta de entrada en Docker Hub: deja el compose y el .env en la
          # carpeta del usuario. Se construye desde la raiz del repo.
          - { service: instalador, image: livemetric, context: ., dockerfile: ./docker-hub/Dockerfile, descripcion: "LiveMetric: prepara la carpeta para correr el sistema con docker compose" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # -----------------------------------------------------------------------
      # Construccion LOCAL (load: true, push: false). La imagen se queda en el
      # runner para escanearla; las capas quedan en la cache de GitHub para
      # que "publish" suba exactamente esta misma imagen.
      # -----------------------------------------------------------------------
      - name: Construir imagen (sin publicar todavia)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # Un valor por corrida: la capa de "apk upgrade" no sale de la cache de
          # una publicacion anterior (ver ARG ACTUALIZAR_PAQUETES en el Dockerfile).
          build-args: ACTUALIZAR_PAQUETES=${{ github.run_id }}
          load: true
          push: false
          tags: livemetric-${{ matrix.service }}:release-candidate
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # -----------------------------------------------------------------------
      # PUERTA DE SEGURIDAD: mismas reglas que el job "container-scan" del
      # pipeline principal. exit-code 1 detiene el job, y ninguna de las ocho
      # imagenes se publica.
      # -----------------------------------------------------------------------
      - name: Escanear la imagen candidata con Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'livemetric-${{ matrix.service }}:release-candidate'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: '.trivyignore'

      # -----------------------------------------------------------------------
      # SBOM en CycloneDX de la imagen que se va a publicar y de las
      # dependencias del servicio (como en el pipeline principal), guardados
      # en la corrida. Ademas, la publicacion adjunta el SBOM a la imagen en
      # Docker Hub (sbom: true, en "publish").
      # -----------------------------------------------------------------------
      - name: Generar el SBOM de la imagen
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'livemetric-${{ matrix.service }}:release-candidate'
          format: 'cyclonedx'
          output: 'sbom-${{ matrix.service }}-${{ needs.version.outputs.semver }}-imagen.cdx.json'

      # Solo los servicios declaran dependencias de Node (package-lock.json):
      # el SBOM de la base y el del instalador es el de la imagen.
      - name: Generar el SBOM de las dependencias
        if: startsWith(matrix.context, './services/')
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: './services/${{ matrix.service }}'
          format: 'cyclonedx'
          output: 'sbom-${{ matrix.service }}-${{ needs.version.outputs.semver }}-dependencias.cdx.json'

      - name: Guardar el SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-${{ matrix.service }}-${{ needs.version.outputs.semver }}
          path: sbom-${{ matrix.service }}-*.cdx.json
          if-no-files-found: error
          retention-days: 90

  # ---------------------------------------------------------------------------
  # 2b) Antes de publicar: el compose de Docker Hub (docker-hub/docker-compose.yml)
  #     tiene que arrancar con estas imagenes, desde una carpeta sin el repo,
  #     como lo usaria cualquiera: crea el .env, levanta todo y responde.
  # ---------------------------------------------------------------------------
  probar-compose:
    name: Probar el compose de Docker Hub
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
      # Una etiqueta que no existe en Docker Hub: el compose usa las imagenes
      # construidas aqui, nunca las publicadas.
      LIVEMETRIC_VERSION: prueba-${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Construir las 8 imagenes
        run: |
          construir() {
            docker build -q --build-arg ACTUALIZAR_PAQUETES="${{ github.run_id }}" \
              -f "$3" -t "${DOCKERHUB_NAMESPACE}/$1:${LIVEMETRIC_VERSION}" "$2"
          }
          for s in auth voting analytics scrutiny scheduler frontend; do
            construir "livemetric-$s" "./services/$s" "./services/$s/Dockerfile"
          done
          construir livemetric-db ./db ./db/Dockerfile
          construir livemetric . ./docker-hub/Dockerfile

      # Como en la pagina de Docker Hub: en una carpeta vacia, la imagen de
      # instalacion deja el compose y el .env.
      - name: Preparar la carpeta con la imagen de instalacion
        run: |
          mkdir -p "$RUNNER_TEMP/livemetric"
          cd "$RUNNER_TEMP/livemetric"
          if docker run --rm "${DOCKERHUB_NAMESPACE}/livemetric:${LIVEMETRIC_VERSION}"; then
            echo "❌ Sin -v no deberia seguir: los archivos se perderian"
            exit 1
          fi
          docker run --rm -v "${PWD}:/salida" "${DOCKERHUB_NAMESPACE}/livemetric:${LIVEMETRIC_VERSION}"
          test -f docker-compose.yml && test -f .env

      - name: Sin .env, no arranca nada
        working-directory: ${{ runner.temp }}/livemetric
        run: |
          mv .env .env.guardado
          if docker compose up -d; then
            echo "❌ Arranco sin .env"
            exit 1
          fi
          docker compose logs revisar-configuracion | grep -q "docker compose run --rm configurar"
          docker compose down
          mv .env.guardado .env

      - name: Levantar el sistema
        working-directory: ${{ runner.temp }}/livemetric
        run: |
          docker compose run --rm configurar | grep -q "completo"
          docker compose up -d

      - name: Comprobar que responde
        run: |
          curl -fsS --retry 30 --retry-delay 3 --retry-all-errors -o /dev/null http://localhost:3000/
          for s in auth voting analytics scrutiny; do
            curl -fsS --retry 30 --retry-delay 3 --retry-all-errors -o /dev/null "http://localhost:3000/${s}/health"
            echo "✅ ${s} responde a traves de nginx"
          done

      - name: Registro de los contenedores (si fallo)
        if: failure()
        working-directory: ${{ runner.temp }}/livemetric
        run: docker compose ps -a && docker compose logs --tail 40

      - name: Bajar el sistema
        if: always()
        working-directory: ${{ runner.temp }}/livemetric
        run: docker compose down -v || true

  # ---------------------------------------------------------------------------
  # 3) Publica las ocho imagenes, solo si las ocho pasaron el escaneo y el
  #    compose de Docker Hub arranco con ellas.
  # ---------------------------------------------------------------------------
  publish:
    name: Publicar ${{ matrix.service }}
    needs: [version, scan, probar-compose]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: auth, image: livemetric-auth, context: ./services/auth, dockerfile: ./services/auth/Dockerfile, descripcion: "Microservicio auth de LiveMetric" }
          - { service: voting, image: livemetric-voting, context: ./services/voting, dockerfile: ./services/voting/Dockerfile, descripcion: "Microservicio voting de LiveMetric" }
          - { service: analytics, image: livemetric-analytics, context: ./services/analytics, dockerfile: ./services/analytics/Dockerfile, descripcion: "Microservicio analytics de LiveMetric" }
          - { service: scrutiny, image: livemetric-scrutiny, context: ./services/scrutiny, dockerfile: ./services/scrutiny/Dockerfile, descripcion: "Microservicio scrutiny de LiveMetric" }
          - { service: scheduler, image: livemetric-scheduler, context: ./services/scheduler, dockerfile: ./services/scheduler/Dockerfile, descripcion: "Microservicio scheduler de LiveMetric" }
          - { service: frontend, image: livemetric-frontend, context: ./services/frontend, dockerfile: ./services/frontend/Dockerfile, descripcion: "Frontend de LiveMetric (React + nginx)" }
          - { service: db, image: livemetric-db, context: ./db, dockerfile: ./db/Dockerfile, descripcion: "Base de datos de LiveMetric: PostgreSQL 16 con el esquema y las migraciones" }
          # La puerta de entrada en Docker Hub: deja el compose y el .env en la
          # carpeta del usuario. Se construye desde la raiz del repo.
          - { service: instalador, image: livemetric, context: ., dockerfile: ./docker-hub/Dockerfile, descripcion: "LiveMetric: prepara la carpeta para correr el sistema con docker compose" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # -----------------------------------------------------------------------
      # Etiquetas y metadatos OCI. metadata-action genera automaticamente:
      #   livemetric/livemetric-auth:1.0.0   (version exacta)
      #   livemetric/livemetric-auth:v1.0.0  (la misma, escrita igual que el
      #                                       tag de git: de "git tag" a
      #                                       "docker pull" sin traducir)
      #   livemetric/livemetric-auth:1.0     (linea menor, para recibir parches)
      #   livemetric/livemetric-auth:latest  (ultima version estable: solo si
      #                                       esta es la mas nueva, ver "version")
      # y ademas inyecta labels OCI (fuente, revision, fecha) en la imagen,
      # para que cualquiera pueda rastrear desde una imagen publicada hasta
      # el commit exacto que la produjo.
      # -----------------------------------------------------------------------
      - name: Calcular etiquetas y metadatos
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ vars.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.semver }}
            type=raw,value=${{ needs.version.outputs.semver }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.semver }}
            type=raw,value=latest,enable=${{ needs.version.outputs.latest }}
          labels: |
            org.opencontainers.image.title=LiveMetric ${{ matrix.service }}
            org.opencontainers.image.description=${{ matrix.descripcion }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.vendor=LiveMetric

      # -----------------------------------------------------------------------
      # El login ocurre DESPUES del escaneo, a proposito: si alguna imagen no
      # pasa, el runner nunca llega a manejar las credenciales de Docker Hub.
      # -----------------------------------------------------------------------
      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # Con la cache que dejo "scan", no reconstruye nada: etiqueta y sube la
      # MISMA imagen ya escaneada. sbom: true adjunta a la imagen publicada
      # su SBOM (una "attestation" de BuildKit, en SPDX): queda en Docker Hub
      # junto a cada version, y se lee con
      #   docker buildx imagetools inspect <imagen>:<version> --format '{{ json .SBOM }}'
      # -----------------------------------------------------------------------
      - name: Publicar en Docker Hub
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # El mismo valor que en "scan": la misma capa de "apk upgrade".
          build-args: ACTUALIZAR_PAQUETES=${{ github.run_id }}
          push: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}

      - name: Registrar lo publicado en el resumen
        run: |
          {
            echo "### 🐳 ${{ matrix.service }} publicado"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 4) Comprueba en Docker Hub que "latest" quedo en esta version en las ocho
  #    imagenes (la misma imagen, por su digest). Si no, la corrida falla.
  # ---------------------------------------------------------------------------
  verify-latest:
    name: Verificar latest en Docker Hub
    needs: [version, publish]
    if: needs.version.outputs.latest == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Comparar latest con la version publicada
        env:
          NS: ${{ vars.DOCKERHUB_NAMESPACE }}
          VERSION: ${{ needs.version.outputs.semver }}
        run: |
          CLEAN="${VERSION#v}"
          # "|| true": si una etiqueta no existe, se informa y se sigue con las
          # demas, para ver el estado de las ocho en una sola corrida.
          FALLAS=0
          for imagen in livemetric-auth livemetric-voting livemetric-analytics livemetric-scrutiny \
                        livemetric-scheduler livemetric-frontend livemetric-db livemetric; do
            IMAGEN="${NS}/${imagen}"
            VERSIONADA="$(docker buildx imagetools inspect "${IMAGEN}:${CLEAN}" --format '{{ .Manifest.Digest }}' || true)"
            LATEST="$(docker buildx imagetools inspect "${IMAGEN}:latest" --format '{{ .Manifest.Digest }}' || true)"
            if [ -n "$VERSIONADA" ] && [ "$VERSIONADA" = "$LATEST" ]; then
              echo "✅ ${IMAGEN}:latest = ${CLEAN}"
            else
              echo "❌ ${IMAGEN}:latest no es ${CLEAN} (latest ${LATEST:-sin digest}, ${CLEAN} ${VERSIONADA:-sin digest})"
              FALLAS=$((FALLAS + 1))
            fi
          done
          [ "$FALLAS" -eq 0 ]

  # ---------------------------------------------------------------------------
  # 4b) La pagina de nicolaspineda1421/livemetric en Docker Hub: su README es
  #     docker-hub/README.md, con los comandos para correr el sistema. Solo
  #     con la version mas nueva, la que recibe latest.
  #
  #     Docker Hub exige un token con permiso "Read, Write, Delete" para
  #     cambiar la pagina; el de publicar (DOCKERHUB_TOKEN) puede ser solo
  #     "Read & Write". Por eso usa DOCKERHUB_DESCRIPCION_TOKEN si existe, y
  #     si la pagina no se puede actualizar, lo avisa sin frenar el release:
  #     las imagenes ya estan publicadas y verificadas.
  # ---------------------------------------------------------------------------
  docker-hub-page:
    name: Pagina de Docker Hub
    needs: [version, verify-latest]
    if: needs.version.outputs.latest == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Publicar docker-hub/README.md como la pagina del repo
        id: pagina
        continue-on-error: true
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_DESCRIPCION_TOKEN || secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_NAMESPACE }}/livemetric
          short-description: "Votación en tiempo real con acta firmada. Corre el sistema con docker run y docker compose"
          readme-filepath: ./docker-hub/README.md

      - name: Registrar el resultado en el resumen
        env:
          RESULTADO: ${{ steps.pagina.outcome }}
          NS: ${{ vars.DOCKERHUB_NAMESPACE }}
        run: |
          if [ "$RESULTADO" = success ]; then
            echo "### 📄 Pagina de Docker Hub actualizada: https://hub.docker.com/r/${NS}/livemetric" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::No se pudo actualizar la pagina de ${NS}/livemetric en Docker Hub"
            {
              echo "### ⚠️ La pagina de Docker Hub no se actualizo"
              echo ""
              echo "Las imagenes si se publicaron. Docker Hub pide un token con permiso **Read, Write, Delete** para cambiar la pagina: crea uno (Account Settings > Personal access tokens) y guardalo como el secret \`DOCKERHUB_DESCRIPCION_TOKEN\`, o pega a mano \`docker-hub/README.md\` en la pagina del repo."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # ---------------------------------------------------------------------------
  # 5) Resumen del release: deja en la pestaña Summary una tabla con las 8
  #    imagenes y el comando para consumirlas. Sirve de evidencia directa
  #    para el informe tecnico y la sustentacion.
  # ---------------------------------------------------------------------------
  release-summary:
    name: Resumen del release
    needs: [version, scan, probar-compose, publish, verify-latest]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Escribir resumen
        run: |
          VERSION="${{ needs.version.outputs.semver }}"
          NS="${{ vars.DOCKERHUB_NAMESPACE }}"
          CLEAN="${VERSION#v}"

          if [ "${{ needs.scan.result }}" != "success" ]; then
            {
              echo "## ❌ Release ${VERSION} NO publicado"
              echo ""
              echo "Una o mas imagenes no superaron el escaneo de Trivy, asi que no se publico ninguna de las 8. Docker Hub sigue como estaba."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "${{ needs.probar-compose.result }}" != "success" ]; then
            {
              echo "## ❌ Release ${VERSION} NO publicado"
              echo ""
              echo "El compose de Docker Hub (docker-hub/docker-compose.yml) no arranco con estas imagenes, asi que no se publico ninguna. El detalle esta en el job \"Probar el compose de Docker Hub\"."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "${{ needs.publish.result }}" != "success" ]; then
            {
              echo "## ❌ Release ${VERSION} publicado a medias"
              echo ""
              echo "Las 8 imagenes pasaron el escaneo, pero alguna no se pudo subir a Docker Hub. Vuelve a correr los jobs fallidos (Re-run failed jobs) para completarla."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "${{ needs.verify-latest.result }}" = "failure" ]; then
            {
              echo "## ❌ Release ${VERSION}: latest no quedo en esta version"
              echo ""
              echo "Las imagenes se publicaron, pero en Docker Hub latest no coincide con ${VERSION} en todas. El detalle esta en el job \"Verificar latest en Docker Hub\"."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "${{ needs.version.outputs.latest }}" = "true" ]; then
            ETIQUETAS="\`${VERSION}\` (igual que el tag de git), \`${CLEAN%.*}\` y \`latest\` (comprobado en Docker Hub: es la misma imagen en las 8)"
          else
            ETIQUETAS="\`${VERSION}\` (igual que el tag de git) y \`${CLEAN%.*}\`. **No** recibe \`latest\`: ya hay una version mas nueva publicada"
          fi

          {
            echo "## ✅ Release ${VERSION} publicado en Docker Hub"
            echo ""
            echo "| Microservicio | Imagen |"
            echo "|---|---|"
            for s in auth voting analytics scrutiny scheduler frontend db; do
              echo "| ${s} | \`${NS}/livemetric-${s}:${CLEAN}\` |"
            done
            echo "| instalacion | \`${NS}/livemetric:${CLEAN}\` |"
            echo ""
            echo "Cada imagen tambien queda como ${ETIQUETAS}."
            echo ""
            echo "Las 8 imagenes superaron el escaneo de Trivy (CRITICAL/HIGH), y el sistema arranco con ellas desde la imagen de instalacion, antes de publicar cualquiera."
            echo ""
            echo "Para correr el sistema sin el repositorio, solo con Docker (en una carpeta vacia):"
            echo '```bash'
            echo "docker run --rm --pull always -v \"\${PWD}:/salida\" ${NS}/livemetric"
            echo "docker compose up -d --pull always"
            echo '```'
            echo ""
            echo "Cada imagen lleva su SBOM adjunto en Docker Hub, y el de CycloneDX (imagen y dependencias) queda en los artefactos de esta corrida. Para leer el adjunto:"
            echo '```bash'
            echo "docker buildx imagetools inspect ${NS}/livemetric-auth:${CLEAN} --format '{{ json .SBOM }}'"
            echo '```'
            echo ""
            echo "Para descargarlas:"
            echo '```bash'
            echo "for s in auth voting analytics scrutiny scheduler frontend db; do"
            echo "  docker pull ${NS}/livemetric-\$s:${CLEAN}"
            echo "done"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
