# Cabeceras de seguridad de todas las respuestas del frontend. Van en un
# archivo aparte porque nginx no hereda los add_header del server en un
# location que define el suyo (como location = /config.js en nginx.conf):
# así se incluyen en los dos lugares sin repetirlas.

# Content-Security-Policy: el navegador solo ejecuta scripts de este mismo
# origen y solo se conecta a él (el API pasa por el proxy de nginx), sin
# plugins ni frames. Lo que se permite además, y por qué:
#   - style-src-attr 'unsafe-inline': el atributo style de los elementos
#     (React y los gráficos lo usan). Elementos <style> en línea, ninguno.
#   - el hash sha256 de style-src: el único <style> en línea autorizado, que
#     html2canvas 1.4.1 inserta al exportar un tablero a PDF (en
#     createPseudoHideStyles). Si se actualiza html2canvas y ese texto
#     cambia, el navegador lo informa en la consola con el hash nuevo.
#   - data: y blob: en imágenes: las fotos de los candidatos son data: URLs
#     y la exportación a PDF dibuja con canvas.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'sha256-UP0QZg7irvSMvOBz9mH2PIIE28+57UiavRfeVea0l3g='; style-src-attr 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Ninguna API sensible del navegador (cámara, micrófono, ubicación, ...).
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
# Aislamiento entre orígenes: otra pestaña no puede tomar el control de
# esta, y sus recursos no se cargan desde otros sitios.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
