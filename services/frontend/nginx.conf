server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No cachear config.js: se regenera en cada arranque del contenedor y
    # el navegador no debe quedarse con una versión vieja de los puertos.
    # Se sirve desde /var/run (tmpfs, escribible) porque el resto del sitio
    # (/usr/share/nginx/html) es de solo lectura ("read_only: true" en compose).
    location = /config.js {
        alias /var/run/config.js;
        add_header Cache-Control "no-store";
    }

    # SPA: cualquier ruta que no sea un archivo real cae en index.html
    # (necesario si en el futuro se agrega enrutamiento del lado del cliente).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cabeceras de seguridad básicas a nivel de servidor web estático.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
