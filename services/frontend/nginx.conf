server {
    # 8080 y no 80: nginx corre entero sin root (ver Dockerfile), y un
    # usuario sin privilegios no puede abrir puertos <1024. Hacia afuera
    # sigue siendo el 3000 (docker-compose.yml / main.tf).
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Sin la versión de nginx en la cabecera Server ni en las páginas de error.
    server_tokens off;

    # Cabeceras reenviadas a los 4 microservicios (ver location /auth/,
    # /voting/, /analytics/, /scrutiny/ abajo): les permite ver la IP real
    # del cliente y el esquema original (http/https) detrás del proxy, en
    # vez de ver siempre "nginx" como origen de cada request. Van a nivel de
    # server para no repetirlas en cada location (nginx no hereda
    # proxy_set_header de forma parcial: si un location define una, deja de
    # heredar todas, así que mejor centralizarlas acá).
    # Host fijo al del upstream ($proxy_host, ej. "auth-service:3001") y no el
    # de la cabecera Host que manda el cliente: ese valor lo controla quien
    # hace la request, y ningún microservicio lo necesita.
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Los servicios mandan sus propias cabeceras de seguridad (helmet). Se
    # quitan para que cada respuesta lleve un solo juego, el de
    # cabeceras-seguridad.conf, y no dos contradictorios (por ejemplo
    # X-Frame-Options SAMEORIGIN y DENY a la vez).
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header Cross-Origin-Resource-Policy;
    proxy_hide_header Cross-Origin-Embedder-Policy;

    # Proxy reverso a los 4 microservicios: el navegador solo habla con este
    # origen (el puerto del frontend); nginx reenvía server-a-server por la
    # red interna de Docker ("app-net"), usando el nombre del servicio de
    # compose, nunca localhost:<puerto>. Esto es lo que permite exponer TODO
    # el sistema detrás de una sola URL pública (ver README, sección de
    # acceso remoto), en vez de tener que exponer 4 puertos sueltos.
    location /auth/ {
        proxy_pass http://auth-service:3001/;
    }
    location /voting/ {
        proxy_pass http://voting-service:3002/;
    }
    location /analytics/ {
        proxy_pass http://analytics-service:3003/;
    }
    location /scrutiny/ {
        proxy_pass http://scrutiny-service:3004/;
    }

    # No cachear config.js: se regenera en cada arranque del contenedor y
    # el navegador no debe quedarse con una versión vieja de los puertos.
    # Se sirve desde /var/run (tmpfs, escribible) porque el resto del sitio
    # (/usr/share/nginx/html) es de solo lectura ("read_only: true" en compose).
    location = /config.js {
        alias /var/run/config.js;
        add_header Cache-Control "no-store";
        # Este add_header anula la herencia de los del server: se repiten.
        include /etc/nginx/cabeceras-seguridad.conf;
    }

    # SPA: cualquier ruta que no sea un archivo real cae en index.html
    # (necesario si en el futuro se agrega enrutamiento del lado del cliente).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cabeceras de seguridad de todas las respuestas (ver el archivo).
    include /etc/nginx/cabeceras-seguridad.conf;
}
