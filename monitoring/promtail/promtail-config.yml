# =============================================================================
# LiveMetric — Promtail (recoleccion de logs de contenedores)
#
# Lee los logs de los contenedores directamente del socket de Docker y los
# envia a Loki, etiquetados por servicio. No requiere modificar los servicios:
# aprovecha que todos escriben a stdout, como corresponde a una aplicacion
# contenerizada.
# =============================================================================

server:
  http_listen_port: 9080
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:

  - job_name: contenedores-livemetric
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s

    relabel_configs:
      # Solo los contenedores de LiveMetric, no los del stack de monitoreo.
      - source_labels: ['__meta_docker_container_name']
        regex: '/(livemetric-.*)'
        action: keep
        target_label: 'contenedor'
        replacement: '$1'

      # Etiqueta corta por servicio: auth, voting, analytics, scrutiny,
      # scheduler, frontend, postgres.
      - source_labels: ['__meta_docker_container_name']
        regex: '/livemetric-(.*)'
        target_label: 'servicio'
        replacement: '$1'

      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'flujo'
